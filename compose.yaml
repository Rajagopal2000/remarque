# Local / self-hosted deployment with Docker Compose.
#
#   cd server && cp .env.example .env   # then edit .env (see README)
#   docker compose up -d
#
# Subscription auth inside the container needs CLAUDE_CODE_OAUTH_TOKEN in
# server/.env (generate once with: claude setup-token).
# Optional profiles:
#   --profile anki     in-container Anki + AnkiConnect for AnkiWeb sync
#                      (set ANKI_CONNECT_URL=http://anki:8765 in server/.env,
#                      then log in once at http://localhost:3000)
#   --profile ollama   local vision model for transcription
#                      (set TRANSCRIBE_PROVIDER=openai,
#                      OPENAI_BASE_URL=http://ollama:11434/v1, OPENAI_API_KEY=ollama,
#                      OPENAI_TRANSCRIBE_MODEL=qwen2.5vl:7b in server/.env, and
#                      pull the model: docker compose exec ollama ollama pull qwen2.5vl:7b)

services:
  server:
    build: ./server
    image: ghcr.io/rajagopal2000/remarque-server:latest
    ports:
      - "8000:8000"
    env_file:
      - path: server/.env
        required: false
    volumes:
      - remarque-data:/data
      # To let the server sync documents from the tablet, provide the SSH key:
      # uncomment, and set SSH_KEY_PATH=/data/home/.ssh/id_remarkable in server/.env.
      # - ~/.ssh/id_remarkable:/ssh-key/id_remarkable:ro
    # Copies the mounted SSH key with the 0600 permissions ssh insists on,
    # then starts the API. Works unchanged when no key is mounted.
    command:
      - sh
      - -c
      - |
        mkdir -p /data/home/.ssh
        if [ -f /ssh-key/id_remarkable ]; then
          cp /ssh-key/id_remarkable /data/home/.ssh/id_remarkable
          chmod 600 /data/home/.ssh/id_remarkable
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  anki:
    profiles: [anki]
    image: chrislongros/anki-desktop:latest
    environment:
      PUID: "1000"
      PGID: "1000"
    ports:
      - "3000:3000"   # KasmVNC web UI: one-time AnkiWeb login
    volumes:
      - anki-config:/config
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  remarque-data:
  anki-config:
  ollama-models:
