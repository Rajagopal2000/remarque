[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "claude-agent-sdk>=0.2.127",
    "fastapi>=0.139.2",
    "genanki>=0.13.1",
    "openai>=2.48.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "rmscene>=0.8.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
