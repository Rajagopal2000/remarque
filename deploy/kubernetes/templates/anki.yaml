{{- if .Values.anki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remarque-anki
spec:
  replicas: 1
  strategy:
    type: Recreate   # one Anki profile, one writer
  selector:
    matchLabels:
      app: remarque-anki
  template:
    metadata:
      labels:
        app: remarque-anki
    spec:
      # linuxserver-style image: s6-overlay starts as root, then drops to PUID.
      # It cannot run with runAsNonRoot; it is not exposed outside the cluster.
      containers:
        - name: anki
          image: "{{ .Values.anki.image }}:{{ .Values.anki.tag }}"
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 3000   # KasmVNC web UI (one-time AnkiWeb login)
            - containerPort: 8765   # AnkiConnect
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: remarque-anki-config
---
apiVersion: v1
kind: Service
metadata:
  name: remarque-anki
spec:
  type: ClusterIP   # in-cluster only: holds AnkiWeb credentials
  selector:
    app: remarque-anki
  ports:
    - name: ankiconnect
      port: 8765
      targetPort: 8765
    - name: webui
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remarque-anki-config
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.anki.storage }}
{{- end }}
